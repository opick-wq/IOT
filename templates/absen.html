<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Karyawan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Absensi Karyawan</h1>
            <p>Tempelkan Kartu untuk Memulai</p>
        </header>
        <main>
            <div id="main-content">
                <div class="scanner-placeholder">
                    <p id="initial-message">Menunggu Kartu...</p>
                    <small>Pastikan bridge berjalan di komputer.</small>
                </div>
            </div>
            <div id="verification-content" class="hidden">
                <div class="profile-card">
                    <img id="stored-photo" src="" alt="Foto Karyawan">
                    <h2 id="employee-name"></h2>
                    <p id="employee-status"></p>
                </div>
                <div class="camera-card">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    <button id="capture-btn">Ambil Foto & Verifikasi</button>
                </div>
            </div>
        </main>
        <footer>
            <div id="status-message"></div>
            <div class="navigation-links">
                <a href="/dashboard" style="font-size: 0.8rem; color: #aaa;">Halaman Dashboard Admin</a> || <a href="/report" style="font-size: 0.8rem; color: #aaa;">Halaman Laporan Absensi</a>
            </div>
        </footer>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Absensi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container" style="max-width: 1200px;">
        <header>
            <h1><i class="fa-solid fa-clipboard-user"></i> Manajemen Absensi</h1>
            <p>Kelola, filter, dan export data kehadiran karyawan.</p>
        </header>

        <main>
            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="filters">
                    <input type="text" id="searchName" placeholder="Cari Nama..." onkeyup="filterTable()">
                    <select id="filterStatus" onchange="filterTable()">
                        <option value="">Semua Status</option>
                        <option value="Karyawan Tetap">Karyawan Tetap</option>
                        <option value="Magang">Magang</option>
                    </select>
                    <input type="date" id="filterDate" onchange="filterTable()">
                </div>
                <div class="actions">
                    <button onclick="openModal('add')" class="btn-add"><i class="fa-solid fa-plus"></i> Tambah Manual</button>
                    <button onclick="exportToExcel()" class="btn-export"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
                </div>
            </div>

            <!-- TABLE -->
            <div class="table-responsive">
                <table class="report-table" id="attendanceTable">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Karyawan</th>
                            <th>Status</th>
                            <th>Tanggal & Waktu</th>
                            <th>Tipe</th>
                            <th class="no-print">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- PAGINATION -->
            <div class="pagination-container">
                <span id="pageInfo">Menampilkan 0-0 dari 0 data</span>
                <div class="pagination-buttons">
                    <button onclick="prevPage()" id="btnPrev">Prev</button>
                    <button onclick="nextPage()" id="btnNext">Next</button>
                </div>
            </div>
        </main>

        <footer>
            <div class="navigation-links">
                <a href="/dashboard">Kembali ke Dashboard</a>
            </div>
        </footer>
    </div>

    <!-- MODAL (Perhatikan: class 'hidden' dihapus) -->
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Tambah Data Absensi</h2>
            <form id="attendanceForm">
                <input type="hidden" id="recordId">
                
                <div class="form-group" id="employeeField">
                    <label>Nama Karyawan</label>
                    <select id="employeeSelect" required></select>
                </div>

                <div class="form-group">
                    <label>Waktu Absen</label>
                    <input type="datetime-local" id="timestampInput" required>
                </div>

                <div class="form-group">
                    <label>Tipe Absensi</label>
                    <select id="typeInput" required>
                        <option value="check_in">Check In (Masuk)</option>
                        <option value="check_out">Check Out (Pulang)</option>
                    </select>
                </div>

                <button type="submit" class="btn-save">Simpan</button>
            </form>
        </div>
    </div>

    <script>
        const rawData = [
            {% for record in records %}
            {
                id: {{ record.id | default(0) }},
                name: "{{ record.employees.name }}",
                status: "{{ record.employees.status }}",
                timestamp: "{{ record.timestamp }}",
                type: "{{ record.type }}",
                employee_id: {{ record.employee_id | default(0) }}
            },
            {% endfor %}
        ];
    </script>

    <script>
        let currentPage = 1;
        const rowsPerPage = 10;
        let filteredData = [...rawData];

        function formatDateTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('id-ID', { 
                day: '2-digit', month: 'long', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = filteredData.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Tidak ada data ditemukan.</td></tr>';
                return;
            }

            pageData.forEach((item, index) => {
                const row = `
                    <tr>
                        <td>${start + index + 1}</td>
                        <td>${item.name}</td>
                        <td><span class="badge ${item.status === 'Karyawan Tetap' ? 'badge-blue' : 'badge-gray'}">${item.status}</span></td>
                        <td>${formatDateTime(item.timestamp)}</td>
                        <td><span class="badge ${item.type === 'check_in' ? 'badge-green' : 'badge-red'}">${item.type === 'check_in' ? 'Masuk' : 'Pulang'}</span></td>
                        <td class="no-print">
                            <button class="btn-icon btn-edit" onclick="openEditModal(${index + start})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-icon btn-delete" onclick="deleteRecord(${item.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            document.getElementById('pageInfo').innerText = `Menampilkan ${Math.min(start + 1, filteredData.length)}-${Math.min(end, filteredData.length)} dari ${filteredData.length} data`;
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = end >= filteredData.length;
        }

        function filterTable() {
            const search = document.getElementById('searchName').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;
            const date = document.getElementById('filterDate').value;

            filteredData = rawData.filter(item => {
                const matchName = item.name.toLowerCase().includes(search);
                const matchStatus = status === '' || item.status === status;
                const itemDate = item.timestamp.split('T')[0]; 
                const matchDate = date === '' || itemDate === date;
                return matchName && matchStatus && matchDate;
            });

            currentPage = 1;
            renderTable();
        }

        function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); } }
        function nextPage() { if ((currentPage * rowsPerPage) < filteredData.length) { currentPage++; renderTable(); } }

        function exportToExcel() {
            const exportData = filteredData.map(item => ({
                "Nama Karyawan": item.name,
                "Status": item.status,
                "Waktu": formatDateTime(item.timestamp),
                "Tipe": item.type === 'check_in' ? 'Masuk' : 'Pulang'
            }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan Absensi");
            XLSX.writeFile(wb, "Laporan_Absensi.xlsx");
        }

        const modal = document.getElementById('dataModal');
        let isEditMode = false;

        async function loadEmployees() {
            const select = document.getElementById('employeeSelect');
            if (select.options.length > 0) return;
            const res = await fetch('/api/employees-list');
            const employees = await res.json();
            employees.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.id;
                option.text = emp.name;
                select.appendChild(option);
            });
        }

        // --- PERBAIKAN LOGIKA MODAL DI SINI ---
        async function openModal(mode, index = null) {
            // Gunakan class 'active' untuk memunculkan modal
            modal.classList.add('active'); 
            await loadEmployees();

            if (mode === 'edit') {
                isEditMode = true;
                const item = filteredData[index];
                document.getElementById('modalTitle').innerText = "Edit Absensi";
                document.getElementById('recordId').value = item.id;
                document.getElementById('employeeField').style.display = 'none';
                
                const localDate = new Date(item.timestamp);
                localDate.setMinutes(localDate.getMinutes() - localDate.getTimezoneOffset());
                document.getElementById('timestampInput').value = localDate.toISOString().slice(0, 16);
                document.getElementById('typeInput').value = item.type;
            } else {
                isEditMode = false;
                document.getElementById('modalTitle').innerText = "Tambah Absensi Manual";
                document.getElementById('attendanceForm').reset();
                document.getElementById('employeeField').style.display = 'block';
            }
        }

        function openEditModal(index) { openModal('edit', index); }

        function closeModal() { 
            // Hapus class 'active' untuk menyembunyikan modal
            modal.classList.remove('active'); 
        }

        // Klik di luar modal untuk menutup
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('recordId').value;
            const timestamp = document.getElementById('timestampInput').value;
            const type = document.getElementById('typeInput').value;
            const employeeId = document.getElementById('employeeSelect').value;
            const isoTimestamp = new Date(timestamp).toISOString();

            let url, method, body;
            if (isEditMode) {
                url = `/api/attendance/${id}`;
                method = 'PUT';
                body = { timestamp: isoTimestamp, type: type };
            } else {
                url = `/api/attendance/manual`;
                method = 'POST';
                body = { employee_id: employeeId, timestamp: isoTimestamp, type: type };
            }

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const result = await res.json();
                if (res.ok) {
                    alert(result.message);
                    location.reload();
                } else {
                    alert("Gagal: " + result.error);
                }
            } catch (err) {
                alert("Terjadi kesalahan sistem.");
            }
        });

        async function deleteRecord(id) {
            if (confirm("Yakin ingin menghapus data absensi ini?")) {
                try {
                    const res = await fetch(`/api/attendance/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        alert("Data terhapus");
                        location.reload();
                    } else {
                        alert("Gagal menghapus");
                    }
                } catch (err) {
                    alert("Error koneksi");
                }
            }
        }

        renderTable();
    </script>
</body>
</html>
